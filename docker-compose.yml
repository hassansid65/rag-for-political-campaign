services:
  # ---------------------------------------------------------------- Milvus deps
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: campaign-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
           -listen-client-urls=http://0.0.0.0:2379
           --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [campaign]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: campaign-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [campaign]

  # -------------------------------------------------------------------- Milvus
  # 2.5+ is required for server-side BM25 (full-text search). On older versions
  # the backend detects the missing capability and uses its in-process BM25
  # index instead — hybrid search keeps working either way.
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: campaign-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC
      - "9091:9091"     # metrics / health
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    networks: [campaign]

  # Optional Milvus web UI — browse collections and run searches by hand.
  attu:
    image: zilliz/attu:v2.5
    container_name: campaign-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8010:3000"
    depends_on: [milvus]
    networks: [campaign]
    profiles: [tools]

  # ------------------------------------------------------------------- backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campaign-backend
    ports:
      - "8000:8000"
    environment:
      VECTOR_BACKEND: milvus
      MILVUS_URI: http://milvus:19530
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-centralindia}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      CORS_ORIGINS: http://localhost:3000
      # Persist the HF cache so a container restart doesn't re-download 500 MB
      # of model weights.
      HF_HOME: /models
    volumes:
      - ./backend/data:/app/data
      - ./data/sample_docs:/app/sample_docs:ro
      - model_cache:/models
    depends_on:
      milvus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live', timeout=5).status==200 else 1)"]
      interval: 30s
      start_period: 180s   # first boot downloads + warms both cross-encoders
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks: [campaign]

  # ------------------------------------------------------------------ frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campaign-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on: [backend]
    restart: unless-stopped
    networks: [campaign]

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  model_cache:

networks:
  campaign:
    driver: bridge
